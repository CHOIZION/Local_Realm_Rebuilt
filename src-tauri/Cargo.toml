[package]
name = "local-realm-rebuilt"
version = "1.9.0-rebuilt.1"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
png = "0.18"
chrono = "0.4"
tempfile = "3"
dunce = "1"
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = "0.13"
ammonia = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png","jpeg","gif","webp","bmp"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
walkdir = "2"
base64 = "0.22"
quick-xml = "0.38"
lopdf = { version = "0.38", default-features = false }
ttf-parser = "0.25"
serde_yaml = "0.9"
csv = "1"
percent-encoding = "2"
aho-corasick = "1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
